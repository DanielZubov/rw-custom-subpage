services:
  rw-custom-subpage:
    build: .
    # Или, после первой публикации образа в свой registry:
    # image: ghcr.io/your-org/rw-custom-subpage:latest
    container_name: rw-custom-subpage
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3011:3010"
    volumes:
      - ./data:/app/data
    networks:
      - srv_proxy

networks:
  # Внешняя сеть, в которой уже живёт remnawave-backend — имя подставьте
  # своё (docker network ls | grep remnawave), либо уберите networks и
  # ports секции и подключитесь к панели по публичному https-адресу.
  srv_proxy:
    external: true
    name: srv_proxy